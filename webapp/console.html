<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>渲染台 · 公式渲染助手</title>
<link rel="stylesheet" href="assets/katex.min.css">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6fa; color: #232838;
    display: flex; flex-direction: column;
  }
  header {
    background: #10265c; color: #fff; padding: 14px 20px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  header .logo { font-size: 20px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .desc { font-size: 12.5px; opacity: .8; }
  header .spacer { flex: 1; }
  header a { color: #9db8ff; font-size: 12.5px; }
  main { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .panes { grid-template-columns: 1fr; } }
  .pane { background: #fff; border: 1px solid #e5e8f0; border-radius: 14px; display: flex; flex-direction: column; min-height: 300px; box-shadow: 0 2px 10px rgba(20,30,60,.05); overflow: hidden; }
  .pane-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #eef0f6; font-size: 13px; font-weight: 600; color: #3a4358; }
  .pane-head .spacer { flex: 1; }
  textarea {
    flex: 1; border: 0; resize: none; padding: 14px 16px; font-size: 14px; line-height: 1.7;
    font-family: Consolas, "Courier New", monospace; outline: none; min-height: 260px;
    background: transparent; color: inherit;
  }
  .result { flex: 1; padding: 14px 16px; font-size: 15px; line-height: 1.75; overflow: auto; min-height: 260px; max-height: 72vh; }
  .result .katex-display { margin: .6em 0; overflow-x: auto; padding: 2px 0; }
  .result .placeholder { color: #9aa2b4; font-size: 13px; }
  .btnbar { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 0 4px; }
  button {
    appearance: none; border: 1px solid rgba(0,0,0,.14); background: #fff; color: #2b3448;
    border-radius: 9px; padding: 9px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  button.primary { background: #3556e0; border-color: #3556e0; color: #fff; }
  button:active { transform: translateY(1px); }
  button.small { padding: 5px 10px; font-size: 12px; border-radius: 7px; }
  .label-toggle { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #5a6478; user-select: none; cursor: pointer; }
  .hint { font-size: 12.5px; color: #8a93a6; margin-top: 14px; line-height: 1.8; }
  .hint kbd { background: #e8ebf3; border: 1px solid #d3d9e8; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 11px; font-family: Consolas, monospace; }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: rgba(28,33,48,.92); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99; }
  .toast.show { opacity: 1; }
  @media (prefers-color-scheme: dark) {
    body { background: #1b202c; color: #e6eaf3; }
    .pane { background: #232937; border-color: #323b50; }
    .pane-head { border-bottom-color: #323b50; color: #c3cbdc; }
    button { background: #2e3648; border-color: rgba(255,255,255,.14); color: #dfe4ef; }
    .hint kbd { background: #38425a; border-color: #47506b; }
  }
</style>
</head>
<body>
<header>
  <span class="logo">∑</span>
  <h1>渲染台</h1>
  <span class="desc">粘贴 AI 输出的 LaTeX / Markdown 公式文本，一键变成可读公式</span>
  <span class="spacer"></span>
  <a href="demo.html">选中渲染演示 →</a>
</header>
<main>
  <div class="panes">
    <section class="pane">
      <div class="pane-head">
        原文（LaTeX / Markdown）
        <span class="spacer"></span>
        <button class="small" id="btn-sample">示例</button>
        <button class="small" id="btn-clear">清空</button>
      </div>
      <textarea id="input" placeholder="把 AI 输出的公式文本粘贴到这里…&#10;支持：$...$、$$...$$、\\(...\\)、\\[...\\]、\\begin{aligned}…\\end{aligned}、`…` 行内代码等" spellcheck="false"></textarea>
    </section>
    <section class="pane">
      <div class="pane-head">渲染结果<span class="spacer"></span><span id="stat" style="font-weight:400;color:#8a93a6;font-size:12px"></span></div>
      <div class="result" id="output"><div class="placeholder">渲染结果会显示在这里。</div></div>
    </section>
  </div>
  <div class="btnbar">
    <button class="primary" id="btn-render">渲染 (Ctrl+Enter)</button>
    <button id="btn-copy-rich" title="以富文本复制结果，可直接粘贴进 Word / 邮件并保留公式">复制结果（富文本）</button>
    <button id="btn-copy-mathml" title="把结果复制为 MathML（部分编辑器可直接识别）">复制为 MathML</button>
    <label class="label-toggle"><input type="checkbox" id="auto"> 输入时自动渲染</label>
  </div>
  <div class="hint">
    在任意网页上（含手机/平板）：选中公式代码 → 点 <b>∑ 渲染</b>。安装方法见 <a href="guide.html">安装引导</a>。<br>
    快捷键：<kbd>Ctrl</kbd>+<kbd>Enter</kbd> 渲染 · 无法解析的片段会以灰色代码样式原样保留，不会弄丢原文。
  </div>
</main>
<div class="toast" id="toast"></div>
<script src="assets/katex.min.js"></script>
<script src="core.js"></script>
<script>
(function () {
  'use strict';
  var $input = document.getElementById('input');
  var $output = document.getElementById('output');
  var $stat = document.getElementById('stat');
  var $toast = document.getElementById('toast');
  var $auto = document.getElementById('auto');
  var toastTimer = null;

  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $toast.classList.remove('show'); }, 1600);
  }

  var SAMPLE = '质能方程 $E = mc^2$ 是狭义相对论的核心。欧拉公式：\n\n$$e^{i\\pi} + 1 = 0$$\n\n求根公式：$x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$，其中判别式 $\\Delta = b^2 - 4ac$。\n\n矩阵示例：\n\n$$\\begin{pmatrix} 1 & 2 \\\\ 3 & 4 \\end{pmatrix}^{T} = \\begin{pmatrix} 1 & 3 \\\\ 2 & 4 \\end{pmatrix}$$\n\n多行推导：\n\n\\begin{aligned} (a+b)^2 &= a^2 + 2ab + b^2 \\\\ (a-b)^2 &= a^2 - 2ab + b^2 \\end{aligned}';

  document.getElementById('btn-sample').addEventListener('click', function () {
    $input.value = SAMPLE;
    render();
  });
  document.getElementById('btn-clear').addEventListener('click', function () {
    $input.value = '';
    $output.innerHTML = '<div class="placeholder">渲染结果会显示在这里。</div>';
    $stat.textContent = '';
    $input.focus();
  });

  function render() {
    var text = $input.value;
    if (!text.trim()) {
      $output.innerHTML = '<div class="placeholder">渲染结果会显示在这里。</div>';
      $stat.textContent = '';
      return;
    }
    var det = window.fraCore.extractFormulas(text);
    $output.textContent = '';
    $output.appendChild(window.fraCore.renderResult(det));
    $stat.textContent = det.count > 0 ? ('识别到 ' + det.count + ' 处公式') : '未识别到公式（会按原样显示）';
  }

  document.getElementById('btn-render').addEventListener('click', render);
  $input.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); render(); }
  });
  var autoTimer = null;
  $input.addEventListener('input', function () {
    if (!$auto.checked) return;
    clearTimeout(autoTimer);
    autoTimer = setTimeout(render, 300);
  });

  function selectOutput() {
    var range = document.createRange();
    range.selectNodeContents($output);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    return sel;
  }

  document.getElementById('btn-copy-rich').addEventListener('click', function () {
    if (!$output.firstChild) { toast('还没有可复制的内容'); return; }
    var sel = selectOutput();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    sel.removeAllRanges();
    toast(ok ? '已复制（富文本），可粘贴到 Word / 邮件' : '复制失败，请手动选择复制');
  });

  document.getElementById('btn-copy-mathml').addEventListener('click', function () {
    var det = window.fraCore.extractFormulas($input.value);
    if (det.count === 0) { toast('未识别到公式'); return; }
    var parts = [];
    det.segments.forEach(function (seg) {
      if (seg.kind === 'text') { parts.push(seg.text); return; }
      var mml = window.fraCore.formulaToMathML(seg.latex, seg.display);
      parts.push(mml || seg.text);
    });
    var text = parts.join('');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('MathML 已复制'); }, function () { toast('复制失败'); });
    } else {
      toast('当前浏览器不支持剪贴板 API');
    }
  });

  $input.focus();
})();
</script>
</body>
</html>
